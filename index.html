
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MythOS Studio Pro</title>
    <meta name="description" content="High-fidelity cinematic production suite with LOREPACK neural synchronization." />
    <meta property="og:title" content="MythOS Studio Pro" />
    <meta property="og:description" content="High-fidelity cinematic production suite with LOREPACK neural synchronization." />
    <!-- Enabled typography plugin for prose classes -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      // Prevent crash when code references process.env in the browser
      window.process = window.process || { env: { API_KEY: "" } };
      
      window.onerror = function (message, source, lineno, colno, error) {
        console.warn("System Log:", message, "at", source, ":", lineno);
        // Benign warnings like ResizeObserver should never block execution
        if (typeof message === 'string' && (message.includes('ResizeObserver') || message.includes('Script error'))) {
          return true;
        }
        return false;
      };

      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#0a0a0a',   // neutral-950: Main Background
              secondary: '#171717', // neutral-900: Secondary Background / Inputs
              surface: '#262626',   // neutral-800: Cards / Modals
              accent: '#404040',    // neutral-700: Borders / Dividers
              brand: '#2563eb',     // blue-600: Primary Action
              'brand-hover': '#1d4ed8', // blue-700: Hover State
            },
            fontFamily: {
              sans: ['ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', "Segoe UI", 'Roboto', "Helvetica Neue", 'Arial', "Noto Sans", 'sans-serif'],
              mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', "Liberation Mono", "Courier New", 'monospace'],
            }
          },
        },
      };
    </script>
    <style>
      body { background-color: #0a0a0a; color: #e5e5e5; margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background-color: #262626; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background-color: #404040; }
      * { scrollbar-width: thin; scrollbar-color: #262626 transparent; }
      
      #critical-error-display, #init-loader {
          position: fixed;
          inset: 0;
          background: #0a0a0a;
          z-index: 99999;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 20px;
          text-align: center;
      }
      
      #critical-error-display { display: none; background: rgba(0,0,0,0.95); }
      .animate-fade-in {
        animation: fadeIn 0.3s ease-out forwards;
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
    </style>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body>
    <div id="root"></div>
    
    <div id="init-loader">
        <div class="flex flex-col items-center">
            <div class="w-12 h-12 border-4 border-blue-500/20 border-t-blue-500 rounded-full animate-spin mb-4"></div>
            <p class="text-blue-500 font-bold tracking-widest text-xs uppercase animate-pulse">Initializing MythOS Engine</p>
        </div>
    </div>

    <div id="critical-error-display">
        <div class="bg-red-900/20 border border-red-500 p-8 rounded-2xl max-w-lg">
            <h1 class="text-red-500 font-bold text-2xl mb-4">CRITICAL SYSTEM ERROR</h1>
            <p class="text-neutral-300 mb-6 error-msg">The application failed to initialize.</p>
            <button onclick="window.location.reload()" class="bg-red-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-red-500 transition-colors">Retry Boot Sequence</button>
        </div>
    </div>

    <script type="module" src="/index.tsx"></script>
  </body>
</html>
